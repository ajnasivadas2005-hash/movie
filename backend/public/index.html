
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Movie Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎬 MovieHub</h1>
    <p>Discover your favourite movies</p>
</header>

<section class="hero">
    <h2>Explore Movies</h2>
    <p>Find information about your favourite films</p>

        <p>Loading movies...</p>
    </div>
</main>

<footer>
    <p>© 2026 MovieHub | Movie Information System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
